<h1 class="gruss" [class.geloest]="geloest()" aria-label="Frohe Weihnachten, Gedoplan">
    <span class="zeile zeile-1" aria-hidden="true">
      <span [class.g]="schalter()[0]">Frohe</span><span [class.g]="schalter()[1]">Weih</span><span [class.g]="schalter()[2]">nachten</span>
    </span>
  <span class="zeile zeile-2" aria-hidden="true">
      <span [class.g]="schalter()[3]">Ge</span><span [class.g]="schalter()[4]">do</span><span [class.g]="schalter()[5]">plan</span>
    </span>
</h1>

<div class="schalter" role="group" aria-label="Schalter">
  @for (i of reihenfolge; track i) {
    <button type="button"
            aria-label="Schalter"
            [disabled]="geloest()"
            (click)="druecken(i)">✦</button>
  }
</div>

<p class="status">
  @if (geloest()) {
    Geschafft in {{ zuege() }} Zügen!
  }
  <button type="button" class="neustart" (click)="neuStart()">Neustart</button>
</p>
